name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install YAML validator dependency
        run: python -m pip install 'ruamel.yaml>=0.18,<0.19'
      - name: Offline skill contracts, syntax, and regression suites
        run: python scripts/check.py
